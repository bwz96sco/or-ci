[project]
name = "or-ci"
version = "0.1.0"
description = "CI-style verification for operations-research model submissions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gurobipy==12.0.1",
]

[project.scripts]
or-ci = "or_ci.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["or_ci*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
